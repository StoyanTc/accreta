[workspace]
resolver = "2"
members = [
    "accreta",
    "accreta-ffi",
    "accreta-node",
    "accreta-py",
    "accreta-java",
    "accreta-wasm",
    "accreta-metrics",
]

[workspace.dependencies]
accreta = { path = "accreta", version = "0.4.1" }

# PLACE YOUR WORKSPACE-WIDE PROFILES HERE:
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
