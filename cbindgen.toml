language = "C"
header = "/* Generated by cbindgen. DO NOT EDIT BY HAND. */"
include_guard = "ACCRETA_FFI_H"
tab_width = 4
style = "type"
documentation = true

# No [export] prefix: every exported type (AccretaSchema, AccretaEngine, ...) already carries
# an "Accreta" prefix in its Rust name. Setting export.prefix here double-prefixes them into
# AccretaAccretaSchema etc., which both looks wrong and breaks the opaque-type typedefs.

# No [fn] section / prefix: cbindgen already wraps the whole header in
# `#ifdef __cplusplus extern "C" { ... } #endif` for you when language = "C". A literal
# `extern "C"` pasted in front of each declaration (as `[fn] prefix = "extern \"C\""` does) is
# C++ linkage syntax, not valid inside a header a C compiler parses on its own — that's the
# "expected identifier or '(' before string constant" error.

[enum]
# Bare variant names (Sum, Min, Max, Minute, I64, Ok, ...) would pollute the C global namespace
# and collide with common macros/typedefs. SCREAMING_SNAKE_CASE variants prefixed with the enum
# name give e.g. ACCRETA_AGGREGATE_KIND_SUM, ACCRETA_BUCKET_LEVEL_MINUTE, ACCRETA_STATUS_OK.
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
