[package]
name = "accreta"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "A reusable mergeable-state aggregation framework for time-series rollups"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stoyantc/accreta"
readme = "README.md"
keywords = ["aggregation", "time-series", "rollup", "statistics", "metrics"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2.0.20"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "engine_bench"
harness = false
